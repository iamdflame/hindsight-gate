name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm i --no-save @gluwa/asc-contracts@0.2.1
      - run: forge test -vv
